{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
    <div class="eyebrow">
        <a href="{% url 'myapp:user_list' %}">Directory</a>
        <span>/</span>
        <a href="{% url 'myapp:user_detail' user_record.pk %}">{{ user_record.name }}</a>
        <span>/</span> Edit
    </div>
    <h1>Edit profile</h1>
    <p class="page-description">Update the details for {{ user_record.name }}.</p>
</div>

<section class="panel form-panel">
    <div class="form-panel-heading">
        <span class="form-heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="m14 5 5 5M4 20l4.3-.9L19 8.4a2.1 2.1 0 0 0-3-3L5.3 16.1 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div><h2>Profile information</h2><p>Fields marked with <span class="required-mark">*</span> are required.</p></div>
    </div>
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% include 'form_fields.html' %}
        <div class="form-actions">
            <a class="button button-secondary" href="{% url 'myapp:user_detail' user_record.pk %}">Cancel</a>
            <button class="button button-primary" type="submit">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Save changes
            </button>
        </div>
    </form>
</section>
{% endblock %}
